[theme]
base = "dark"
primaryColor = "#7DA8FF"
backgroundColor = "#080B14"
secondaryBackgroundColor = "#0E1320"
textColor = "#F2F4F8"
font = "sans serif"

[server]
enableXsrfProtection = true
enableCORS = true
# Serves files from ./static at app/static/<name> - used for the background image.
enableStaticServing = true

[browser]
gatherUsageStats = false
